name: Unity Secret Probe Now
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ['.github/workflows/unity-secret-probe-now.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Presence only
        env:
          S_LICENSE: ${{ secrets.UNITY_LICENSE }}
          S_SERIAL: ${{ secrets.UNITY_SERIAL }}
          S_EMAIL: ${{ secrets.UNITY_EMAIL }}
          S_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          for n in S_LICENSE S_SERIAL S_EMAIL S_PASSWORD; do
            if [ -n "${!n}" ]; then echo "${n}_PRESENT=yes"; else echo "${n}_PRESENT=no"; fi
          done
