name: HF UFO Protocol Research

on:
  push:
    branches: [ hfufo-protocol-research ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download HF UFO base APK
        run: |
          set -euxo pipefail
          rm -rf work protocol-research
          mkdir -p work/xapk protocol-research/smali-matches
          curl -L --fail --retry 4 --retry-delay 3 'https://d.apkpure.net/b/XAPK/com.xaufohf.rxdrone?version=latest' -o work/hfufo.xapk
          unzip -q work/hfufo.xapk -d work/xapk
          BASE=$(find work/xapk -type f -name 'com.xaufohf.rxdrone.apk' | head -n1)
          test -n "$BASE"
          cp "$BASE" work/base.apk
      - name: Install Apktool
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.11.1.jar' -o work/apktool.jar
      - name: Decode smali and capture exact control files
        run: |
          set -euxo pipefail
          java -jar work/apktool.jar d -f -r work/base.apk -o work/smali > protocol-research/apktool.log 2>&1
          find work/smali -type f -name '*.smali' | wc -l > protocol-research/smali-count.txt
          {
            echo '=== DIRECT MATCHES ==='
            for term in AP_MODE_UDP_PORT AP_UDP_SOCKET_PORT FLIGHT_CONTROL CMD_DEVICE_DIRECTION_CONTROL CMD_SPACE_DIRECTION_CONTROL CMD_CAMERA_CONTROL CMD_POWER_CONTROL AXIS_THROTTLE DEVICE_STATE_UDP_TIMEOUT 'UDP send' '192.168.1.1' '192.168.8.1' '192.168.28.1' '192.168.80.1'; do
              echo "--- TERM: $term ---"
              grep -RniF "$term" work/smali 2>/dev/null || true
            done
          } > protocol-research/direct-matches.txt

          n=0
          while IFS= read -r file; do
            test -n "$file" || continue
            dst="protocol-research/smali-matches/match-$n.smali"
            cp "$file" "$dst"
            printf '%s\t%s\n' "$dst" "$file" >> protocol-research/smali-map.txt
            n=$((n+1))
          done < <(grep -RilE 'AP_MODE_UDP_PORT|AP_UDP_SOCKET_PORT|FLIGHT_CONTROL|CMD_DEVICE_DIRECTION_CONTROL|CMD_SPACE_DIRECTION_CONTROL|CMD_CAMERA_CONTROL|CMD_POWER_CONTROL|AXIS_THROTTLE|DEVICE_STATE_UDP_TIMEOUT|UDP send|192\.168\.(1|8|28|80)\.1' work/smali 2>/dev/null | sort -u)
          printf 'match_files=%s\n' "$n" > protocol-research/smali-summary.txt
      - name: Publish exact smali matches
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f protocol-research
          git commit -m "HF UFO exact smali matches ${GITHUB_RUN_NUMBER}"
          git push origin HEAD:refs/heads/hfufo-protocol-results --force
