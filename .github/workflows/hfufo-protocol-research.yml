name: HF UFO Protocol Research

on:
  push:
    branches: [ hfufo-protocol-research ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download HF UFO base APK
        run: |
          set -euxo pipefail
          rm -rf work protocol-research
          mkdir -p work/xapk protocol-research/control-smali
          curl -L --fail --retry 4 --retry-delay 3 'https://d.apkpure.net/b/XAPK/com.xaufohf.rxdrone?version=latest' -o work/hfufo.xapk
          unzip -q work/hfufo.xapk -d work/xapk
          BASE=$(find work/xapk -type f -name 'com.xaufohf.rxdrone.apk' | head -n1)
          test -n "$BASE"
          cp "$BASE" work/base.apk
      - name: Install Apktool
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.11.1.jar' -o work/apktool.jar
      - name: Decode exact flight protocol classes
        run: |
          set -euxo pipefail
          java -jar work/apktool.jar d -f -r work/base.apk -o work/smali > protocol-research/apktool.log 2>&1
          names='Protocol1 ProtocolOfQuanzhi FlyCommand ClientManager DeviceClient SettingCmd CommandHub ICommon IConstant HDManualCtrlActivity'
          : > protocol-research/control-map.txt
          for name in $names; do
            while IFS= read -r file; do
              test -n "$file" || continue
              base=$(basename "$file")
              safe=$(echo "$file" | sed 's#work/smali/##; s#[/]#_#g')
              cp "$file" "protocol-research/control-smali/$safe"
              printf '%s\t%s\n' "protocol-research/control-smali/$safe" "$file" >> protocol-research/control-map.txt
            done < <(find work/smali -type f -name "${name}.smali" -o -name "${name}\$*.smali" | sort)
          done
          {
            echo '=== Protocol1 references ==='
            grep -RniE -B 25 -A 80 'Protocol1;->|ProtocolOfQuanzhi;->|setProtocol|setThrottle|setYaw|setPitch|setRoll|setPower|set.*Direction|packaging\(\)\[B' work/smali/smali_classes3/com/xaufohf/rxdrone 2>/dev/null | head -n 60000 || true
            echo
            echo '=== DeviceClient connection references ==='
            grep -RniE -B 30 -A 100 'DeviceClient|ClientManager|getClient|connectDevice|AP_MODE_UDP_PORT|AP_UDP_SOCKET_PORT|0x8b4|2228|FLIGHT_CONTROL|DRONE_DATA' work/smali 2>/dev/null | head -n 80000 || true
          } > protocol-research/control-context.txt
      - name: Publish protocol classes
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f protocol-research
          git commit -m "HF UFO flight packet classes ${GITHUB_RUN_NUMBER}"
          git push origin HEAD:refs/heads/hfufo-protocol-results --force
