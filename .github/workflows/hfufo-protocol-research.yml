name: HF UFO Protocol Research

on:
  push:
    branches: [ hfufo-protocol-research ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack complete HF UFO XAPK
        run: |
          set -euxo pipefail
          rm -rf work protocol-research
          mkdir -p work/xapk work/all-unpacked protocol-research
          curl -L --fail --retry 4 --retry-delay 3 'https://d.apkpure.net/b/XAPK/com.xaufohf.rxdrone?version=latest' -o work/hfufo.xapk
          unzip -q work/hfufo.xapk -d work/xapk
          find work/xapk -maxdepth 3 -type f -printf '%P\n' | sort > protocol-research/xapk-files.txt
          find work/xapk -type f -name '*.apk' -print0 | xargs -0 sha256sum > protocol-research/apk-hashes.txt
          i=0
          while IFS= read -r -d '' apk; do
            out="work/all-unpacked/apk-$i"
            mkdir -p "$out"
            unzip -q "$apk" -d "$out" || true
            printf '%s\t%s\n' "$out" "$apk" >> protocol-research/apk-map.txt
            i=$((i+1))
          done < <(find work/xapk -type f -name '*.apk' -print0)
      - name: Install analysis tools
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip' -o work/jadx.zip
          mkdir -p work/jadx
          unzip -q work/jadx.zip -d work/jadx
          chmod +x work/jadx/bin/jadx
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils file
      - name: Decompile all APK splits together
        run: |
          set -euxo pipefail
          mkdir -p work/decompiled
          APKS=$(find work/xapk -type f -name '*.apk' -print | tr '\n' ' ')
          work/jadx/bin/jadx --show-bad-code --no-res -d work/decompiled $APKS > protocol-research/jadx.log 2>&1 || true
          find work/decompiled -type f | wc -l > protocol-research/decompiled-file-count.txt
      - name: Extract Java network control and JNI references
        run: |
          {
            echo '=== APP / CONTROL FILES ==='
            find work/decompiled -type f | grep -Ei 'xaufo|hfufo|rxdrone|drone|control|rocker|joystick|flight|wifi|socket|udp|tcp' | head -n 12000 || true
            echo
            echo '=== NATIVE LOAD / JNI ==='
            grep -RniEi 'System\.loadLibrary| native |native [A-Za-z]|JNI|Jni|NDK' work/decompiled 2>/dev/null | head -n 20000 || true
            echo
            echo '=== NETWORK / CONTROL CODE ==='
            grep -RniEi 'DatagramSocket|DatagramPacket|InetSocketAddress|InetAddress|getByName|Socket\(|send\(|write\(|sendto|recvfrom|192\.168\.|172\.|10\.|rtsp://|udp|tcp|joystick|rocker|throttle|yaw|pitch|roll|take.?off|landing|emergency|calibrat|headless|speed|fly.?control|remote.?control' work/decompiled 2>/dev/null | head -n 30000 || true
          } > protocol-research/java-report.txt
      - name: Inspect native libraries from every split
        run: |
          set -euxo pipefail
          {
            echo '=== ALL NATIVE LIBRARIES ==='
            find work/all-unpacked -type f -name '*.so' -print | sort
            echo
            for f in $(find work/all-unpacked -type f -name '*.so' | sort); do
              echo "===== $f ====="
              file "$f" || true
              echo '-- imported/exported network symbols --'
              readelf -Ws "$f" 2>/dev/null | grep -Ei 'socket|sendto|recvfrom|connect|bind|inet_|htons|JNI|control|flight|joystick|udp|tcp' | head -n 6000 || true
              echo '-- high-value strings --'
              strings -a -n 4 "$f" | grep -Ei '192\.168\.|10\.[0-9]+\.|172\.(1[6-9]|2[0-9]|3[01])\.|rtsp://|http://|udp|tcp|socket|sendto|recvfrom|connect|50000|40000|8090|8080|7070|8888|8800|9000|8895|8896|20000|20001|60000|5555|5556|10000|joystick|rocker|throttle|yaw|pitch|roll|take.?off|landing|emergency|calibrat|headless|speed|control' | head -n 12000 || true
              echo '-- JNI strings --'
              strings -a -n 4 "$f" | grep -Ei 'Java_|JNI_OnLoad|com[/._](xaufohf|hfufo)|rxdrone' | head -n 12000 || true
              echo
            done
          } > protocol-research/native-report.txt
      - name: Extract all DEX strings
        run: |
          {
            for f in $(find work/all-unpacked -type f -name 'classes*.dex' | sort); do
              echo "===== $f ====="
              strings -a -n 4 "$f" | grep -Ei '192\.168\.|rtsp://|udp|tcp|socket|Datagram|50000|40000|8090|8080|7070|8888|8800|9000|8895|8896|20000|20001|60000|5555|5556|10000|joystick|rocker|throttle|yaw|pitch|roll|take.?off|landing|emergency|calibrat|headless|control|native' | head -n 20000 || true
            done
          } > protocol-research/dex-report.txt
      - name: Publish findings
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f protocol-research
          git commit -m "HF UFO complete split protocol findings ${GITHUB_RUN_NUMBER}"
          git push origin HEAD:refs/heads/hfufo-protocol-results --force
